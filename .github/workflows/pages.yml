# Veröffentlicht die Web-Version von KALORA auf GitHub Pages.
# Einmalig nötig: Repository → Settings → Pages → Source: „GitHub Actions".
name: KALORA auf GitHub Pages

on:
  push:
    branches: [main, claude/fervent-keller-zgkzo5]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Web-Version bauen (ohne Server, Fotos direkt von TheMealDB)
        run: npx vite build --base ./
        env:
          VITE_STATIC: '1'
          VITE_REMOTE_IMAGES: '1'
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    # Veröffentlicht wird nur vom Hauptzweig – andere Zweige werden nur gebaut und getestet
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
